<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yena Photo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f1a;color:#eee;min-height:100vh;overflow-x:hidden}
.screen{display:none;padding:20px;max-width:480px;margin:0 auto;min-height:100vh;flex-direction:column}
.screen.active{display:flex}
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 0;margin-bottom:8px}
.header h1{font-size:1.3rem;font-weight:700;color:#fff}
.header .sub{font-size:0.8rem;color:#8899aa}
.card{background:#16213e;border-radius:14px;padding:20px;margin-bottom:16px}
.card-title{font-size:1rem;font-weight:600;margin-bottom:12px;color:#fff}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:all 0.2s;text-align:center}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-primary{background:#4f9cf7;color:#fff}
.btn-success{background:#22c55e;color:#fff}
.btn-outline{background:transparent;color:#4f9cf7;border:1px solid #4f9cf7}
.selfie-area{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:16px}
.selfie-preview{width:180px;height:180px;border-radius:50%;border:3px dashed #334155;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#1a1a2e;position:relative}
.selfie-preview.has-image{border-color:#22c55e;border-style:solid}
.selfie-preview img{width:100%;height:100%;object-fit:cover}
.selfie-preview .placeholder{text-align:center;color:#8899aa;font-size:0.85rem}
.selfie-preview .placeholder .icon{font-size:2.5rem;display:block;margin-bottom:4px}
.selfie-buttons{display:flex;gap:8px;width:100%}
.selfie-buttons .btn{flex:1;font-size:0.85rem;padding:10px}
.progress-section{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;padding:40px 0}
.progress-spinner{width:60px;height:60px;border:4px solid #334155;border-top-color:#4f9cf7;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-title{font-size:1.2rem;font-weight:600;margin-bottom:8px}
.progress-sub{color:#8899aa;font-size:0.9rem;margin-bottom:16px}
.result-count{text-align:center;padding:24px 0}
.result-count .number{font-size:3rem;font-weight:800;color:#22c55e}
.result-count .label{font-size:1rem;color:#8899aa;margin-top:4px}
.result-actions{display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-bottom:20px}
.hidden{display:none!important}
.group-item{display:flex;align-items:center;justify-content:space-between;padding:14px;background:#1a1a2e;border-radius:10px;cursor:pointer;margin-bottom:8px;transition:background 0.2s}
.group-item:hover{background:rgba(79,156,247,0.15)}
.group-item .g-name{font-size:0.95rem;font-weight:500}
.group-item .g-count{color:#4f9cf7;font-weight:600;font-size:0.9rem}
.error-text{color:#ef4444;font-size:0.85rem;margin-top:8px;text-align:center}
</style>
</head>
<body>

<!-- Screen: Home -->
<div class="screen" id="screen-home">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
    <div style="font-size:4rem;margin-bottom:16px">📸</div>
    <h1 style="font-size:1.8rem;font-weight:700;margin-bottom:4px" id="greeting">Hi!</h1>
    <p style="color:#8899aa;font-size:0.95rem;margin-bottom:32px">Find your photos using face recognition</p>
    <button class="btn btn-primary" onclick="showScreen('screen-find')" style="font-size:1.1rem">Find Your Photo</button>
  </div>
</div>

<!-- Screen: Find Photos -->
<div class="screen" id="screen-find">
  <div class="header">
    <div>
      <h1>Find Your Photo</h1>
      <div class="sub" id="userInfo"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Upload your selfie</div>
    <div class="selfie-area">
      <div class="selfie-preview" id="selfiePreview" onclick="document.getElementById('selfieInput').click()">
        <div class="placeholder" id="selfiePlaceholder">
          <span class="icon">📷</span>
          Tap to take a selfie
        </div>
        <img id="selfieImage" class="hidden" />
      </div>
      <input type="file" id="selfieInput" accept="image/*" capture="user" hidden />
      <div class="selfie-buttons">
        <button class="btn btn-outline" onclick="document.getElementById('selfieInput').click()">📷 Choose Photo</button>
      </div>
      <div id="faceStatus"></div>
    </div>
  </div>

  <button class="btn btn-primary" id="searchBtn" disabled onclick="startSearch()">Search</button>
  <div style="margin-top:12px">
    <button class="btn btn-outline" onclick="showScreen('screen-home')">← Back</button>
  </div>
</div>

<!-- Screen: Searching -->
<div class="screen" id="screen-searching">
  <div class="progress-section">
    <div class="progress-spinner"></div>
    <div class="progress-title">Searching for your photos</div>
    <div class="progress-sub" id="searchProgressText">Analyzing face...</div>
  </div>
</div>

<!-- Screen: Results -->
<div class="screen" id="screen-results">
  <div class="header">
    <h1>Results</h1>
  </div>

  <div class="result-count">
    <div class="number" id="resultCount">0</div>
    <div class="label" id="resultLabel">photos found</div>
  </div>

  <div class="card" id="resultGroups"></div>

  <div class="result-actions" style="margin-top:auto">
    <button class="btn btn-success" id="sendAllBtn" onclick="sendGroup('')">📨 Send All to Telegram</button>
    <button class="btn btn-outline" onclick="resetSearch()">🔄 Search Again</button>
  </div>
  <div id="sendStatus" style="text-align:center;margin-top:12px;font-size:0.9rem"></div>
</div>

<!-- Screen: Sent -->
<div class="screen" id="screen-sent">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px">
    <div style="font-size:3.5rem;margin-bottom:16px">✅</div>
    <h2 style="margin-bottom:8px;color:#22c55e">Photos Sent!</h2>
    <p style="color:#8899aa;margin-bottom:24px;font-size:0.95rem">Your photos are being sent in Telegram.</p>
    <button class="btn btn-outline" onclick="closeApp()" id="closeBtn">Close</button>
  </div>
</div>

<script>
let tg = null;
try {
  if (window.Telegram && window.Telegram.WebApp) {
    tg = window.Telegram.WebApp;
    tg.ready();
  }
} catch(e) {}

const API = window.location.origin;

let telegramId = null;
let firstName = '';
let searchToken = null;
let selfieFile = null;
let selfieBase64 = null;

document.getElementById('selfieInput').addEventListener('change', function(e) {
  if (e.target.files && e.target.files[0]) {
    selfieFile = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(ev) {
      selfieBase64 = ev.target.result;
      document.getElementById('selfieImage').src = ev.target.result;
      document.getElementById('selfieImage').classList.remove('hidden');
      document.getElementById('selfiePlaceholder').classList.add('hidden');
      document.getElementById('selfiePreview').classList.add('has-image');
      document.getElementById('searchBtn').disabled = false;
    };
    reader.readAsDataURL(e.target.files[0]);
  }
});

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function resetSearch() {
  selfieFile = null;
  selfieBase64 = null;
  searchToken = null;
  document.getElementById('selfieImage').src = '';
  document.getElementById('selfieImage').classList.add('hidden');
  document.getElementById('selfiePlaceholder').classList.remove('hidden');
  document.getElementById('selfiePreview').classList.remove('has-image');
  document.getElementById('searchBtn').disabled = true;
  document.getElementById('faceStatus').innerHTML = '';
  showScreen('screen-find');
}

function closeApp() {
  if (tg) { tg.close(); }
  else { window.close(); }
}

// Init
(function init() {
  if (tg) {
    const user = tg.initDataUnsafe.user;
    if (user) {
      telegramId = user.id;
      firstName = user.first_name;
    }
  }

  if (!telegramId) {
    telegramId = prompt('Enter your Telegram ID:');
    if (!telegramId) {
      document.getElementById('greeting').textContent = 'Welcome!';
      showScreen('screen-home');
      return;
    }
  }

  document.getElementById('greeting').textContent = 'Hi, ' + (firstName || 'there') + '!';
  document.getElementById('userInfo').textContent = 'Hi, ' + (firstName || '');
  showScreen('screen-home');
})();

async function startSearch() {
  if (!selfieFile) return;
  showScreen('screen-searching');
  document.getElementById('searchProgressText').textContent = 'Analyzing face...';

  const formData = new FormData();
  formData.append('selfie', selfieFile);
  formData.append('telegram_id', String(telegramId));

  try {
    const res = await fetch(API + '/api/search', { method: 'POST', body: formData });
    const data = await res.json();

    if (!data.success) {
      document.getElementById('faceStatus').innerHTML = '<div class="error-text">' + (data.error || 'Search failed') + '</div>';
      showScreen('screen-find');
      return;
    }

    if (data.count === 0) {
      document.getElementById('resultCount').textContent = '0';
      document.getElementById('resultLabel').textContent = 'No matching photos found';
      document.getElementById('resultGroups').innerHTML = '<p style="text-align:center;color:#8899aa;padding:12px">Try a different selfie.</p>';
      document.getElementById('sendAllBtn').style.display = 'none';
      showScreen('screen-results');
      return;
    }

    searchToken = data.token;
    document.getElementById('resultCount').textContent = data.count;
    document.getElementById('resultLabel').textContent = data.count === 1 ? 'photo found' : 'photos found';
    document.getElementById('sendAllBtn').style.display = 'block';

    if (data.groups && data.groups.length > 0) {
      document.getElementById('resultGroups').innerHTML =
        '<div class="card-title">Select by date</div>' +
        data.groups.map(function(g) {
          return '<div class="group-item" onclick="sendGroup(\'' + g.date + '\')">' +
            '<span class="g-name">' + g.date + '</span>' +
            '<span class="g-count">' + g.count + ' ' + (g.count === 1 ? 'photo' : 'photos') + '</span>' +
          '</div>';
        }).join('');
    } else {
      document.getElementById('resultGroups').innerHTML = '';
    }

    showScreen('screen-results');
  } catch(e) {
    document.getElementById('faceStatus').innerHTML = '<div class="error-text">Network error. Try again.</div>';
    showScreen('screen-find');
  }
}

async function sendGroup(date) {
  if (!searchToken) return;
  document.getElementById('sendStatus').textContent = 'Sending...';
  document.getElementById('sendAllBtn').disabled = true;

  try {
    const res = await fetch(API + '/api/results/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: searchToken, date: date }),
    });
    const data = await res.json();

    if (data.success) {
      showScreen('screen-sent');
    } else {
      document.getElementById('sendStatus').textContent = data.error || 'Failed to send';
      document.getElementById('sendAllBtn').disabled = false;
    }
  } catch(e) {
    document.getElementById('sendStatus').textContent = 'Network error';
    document.getElementById('sendAllBtn').disabled = false;
  }
}
</script>
</body>
</html>
